server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas do React Router (ex.: /treinos) devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
